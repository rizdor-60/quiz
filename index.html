  const id='u'+Math.random().toString(36).slice(2,10);await R('players/'+id).set({name:n,team,ts:TS});me={id,name:n,team};localStorage.tel_me=JSON.stringify(me);PK='';render()}

let SEL=null,ALB=[],SS=0,VR=null,VT=null,VC={up:0,dn:0},SHOWN={};
function hRender(){const a=$('#app');const st=ST||{phase:'lobby'};
  if(st.phase==='lobby'){if(PK!=='hl'){PK='hl';a.innerHTML=`<div class="card"><h2>ゲーム設定</h2><div class="row2"><label class="small">お題(秒)<input id="cf1" type="number" value="${CF.tText}" onchange="cfg('tText',this.value)"></label><label class="small">お絵かき(秒)<input type="number" value="${CF.tDraw}" onchange="cfg('tDraw',this.value)"></label><label class="small">回答(秒)<input type="number" value="${CF.tAns}" onchange="cfg('tAns',this.value)"></label><label class="small">総ターン数(偶数)<input type="number" step="2" min="2" max="12" value="${CF.turns}" onchange="cfg('turns',this.value)"></label></div><div class="row2"><button class="pri" onclick="start()">ゲーム開始</button><button class="dng" onclick="kickAll()">参加者を全員退出</button></div></div><div id="tg" class="g8"></div>`}hUpd();return}
  if(st.phase==='play'){const k='hp'+st.turn;if(PK!==k){PK=k;a.innerHTML=`<div class="card"><div class="hd"><span>TURN ${st.turn+1} / ${st.turns}:${['お題を書こう','お絵かきタイム！','回答タイム！'][st.turn===0?0:st.turn%2?1:2]}</span></div><div style="display:flex;align-items:center;gap:24px"><div class="big" id="hbig">0</div><div style="flex:1"><div class="bar" style="height:16px"><i id="bar"></i></div></div></div></div><div id="pg" class="pg"></div><div class="row2"><button id="nx" class="pri" onclick="nextTurn()">次のターンへ進む ▶</button><label class="small" style="flex:none;align-self:center"><input id="auto" type="checkbox" ${AUTO?'checked':''} onchange="AUTO=this.checked" style="width:auto"> 全員完了で自動進行</label><button class="dng" onclick="resetGame()">ゲームをリセット</button></div>`}hUpd();return}
  if(st.phase==='show'){if(PK!=='hs'){PK='hs';a.innerHTML=`<div id="sel"></div><div id="stg"></div><div class="row2"><button onclick="resetGame()" class="dng" style="flex:none">ゲームをリセット</button><span class="small" style="align-self:center">Space / → で次へ、← で戻る</span></div>`}hSel();hStage()}}
function hUpd(){const st=ST||{phase:'lobby'};
  if(st.phase==='lobby'){const g=$('#tg');if(!g)return;g.innerHTML=[1,2,3,4,5,6,7,8].map(t=>{const m=Object.values(PL).filter(p=>p.team===t);return `<div class="tc"><b>チーム${t}</b> <span class="small">${m.length}人</span><div class="mem" style="margin-top:6px">${m.map(p=>`<span>${esc(p.name)}</span>`).join('')}</div></div>`}).join('')}
  if(st.phase==='play'){const g=$('#pg');if(!g)return;g.innerHTML=[1,2,3,4,5,6,7,8].map(t=>{const m=roster(t),d=m.filter(u=>DONE[u]).length;return m.length?`<div class="tc"><b>チーム${t}</b>:${d} / ${m.length}人 完了<div class="bar"><i style="width:${d/m.length*100}%;transition:none"></i></div></div>`:''}).join('');
    const nx=$('#nx');if(nx)nx.classList.toggle('pulse',total()>0&&Object.keys(DONE).length>=total())}}
async function cfg(k,v){v=Math.max(k==='turns'?2:5,+v||0);if(k==='turns')v=Math.round(v/2)*2;CF[k]=v;await R('cfg/'+k).set(v);if(k==='turns')$('#cf1')&&PK==='hl'&&(PK='',render())}
async function start(){const ro={};for(let t=1;t<=8;t++){const ids=Object.keys(PL).filter(u=>PL[u].team===t).sort((a,b)=>(PL[a].ts||0)-(PL[b].ts||0)||(a<b?-1:1));if(ids.length)ro[t]=ids}
  if(!Object.keys(ro).length)return alert('参加者がいません');AN=-1;SS=0;SEL=null;SHOWN={};
  await db.ref('tel').update({roster:ro,alb:null,done:null,vote:null,show:null,state:{phase:'play',turn:0,turns:CF.turns,tStart:TS,dur:CF.tText}})}
async function nextTurn(){const s=ST;if(!s||s.phase!=='play')return;if(s.turn+1>=s.turns){await R('state/phase').set('show');return}const t=s.turn+1;await R('state').update({turn:t,tStart:TS,dur:t%2?CF.tDraw:CF.tAns})}
async function resetGame(){if(!confirm('ゲームをリセットして、ロビーに戻します(参加者は残ります)'))return;clearTimeout(VT);SEL=null;PK='';await db.ref('tel').update({state:null,roster:null,alb:null,done:null,vote:null,show:null})}
async function kickAll(){if(!confirm('参加者を全員退出させます'))return;await R('players').set(null)}
function hSel(){const e=$('#sel');if(!e)return;let h='';for(let t=1;t<=8;t++){const m=roster(t);if(!m.length)continue;h+=`<div class="sel"><b style="align-self:center;margin-right:6px">チーム${t}</b>${m.map((u,i)=>`<button class="${SEL&&SEL.team===t&&SEL.album===i?'on':''}" onclick="pick(${t},${i})">${esc((PL[u]||{}).name||'—')}スタート${SHOWN[t+'_'+i]?' ✓':''}</button>`).join('')}</div>`}e.innerHTML=h}
async function pick(t,i){clearTimeout(VT);SEL={team:t,album:i};SS=0;ALB=(await R(`alb/${t}/${i}`).get()).val()||[];if(!Array.isArray(ALB))ALB=Object.assign([],ALB);await R('show').set(null);hSel();hStage()}
const okImg=v=>/^data:image\/(webp|jpeg|png);base64,[A-Za-z0-9+\/=]+$/.test(v);
function items(){const T=ST.turns,o=[];for(let t=0;t<T;t++){let it=ALB[t]||{k:'t',v:'(未提出)',n:'—'};if(it.k==='i'&&!okImg(it.v))it={k:'t',v:'(画像なし)',n:it.n};o.push(it)}return o}
function hStage(){const g=$('#stg');if(!g)return;if(!SEL){g.innerHTML='<h2 style="text-align:center;margin-top:12%">上のボタンから、発表するアルバムを選んでね</h2>';return}
  const T=ST.turns,its=items();
  if(SS<=T){g.innerHTML=its.slice(0,SS).map((it,s)=>{const last=s===SS-1;return it.k==='t'?`<div class="bub L" ${last?'':'style="animation:none"'}><small>${esc(it.n)}</small>${s===0?'最初のお題':'の回答'}:「${esc(it.v)}」</div>`:`<div class="bub R" ${last?'':'style="animation:none"'}><small>${esc(it.n)} のイラスト</small><img src="${it.v}" alt=""></div>`}).join('')||'<h2 style="text-align:center;margin-top:12%;color:#888">スペースキーで開始</h2>';g.scrollTo({top:g.scrollHeight,behavior:'smooth'});return}
  const f=its[0],l=its[T-1];g.innerHTML=`<div class="cmp"><div><div class="small" style="color:#555;text-align:center">最初のお題</div><div class="a">${esc(f.v)}</div></div><div><div class="small" style="color:#555;text-align:center">最後の絵</div>${l.k==='i'?`<img src="${l.v}" alt="">`:`<div class="a">${esc(l.v)}</div>`}</div></div>`+
  `<div class="gz"><i id="gu" style="background:#2ecc71;width:50%"></i><i id="gd" style="background:#ffd166;width:50%"></i></div><div style="display:flex;justify-content:space-between;font:700 44px Georgia,serif"><span>👍 <b id="cu">0</b></span><span id="vtm" class="mono" style="color:#e63946"></span><span>🤔 <b id="cd">0</b></span></div>`;vUpd()}
function vUpd(){const u=VC.up,d=VC.dn,s=u+d||1;const a=$('#cu'),b=$('#cd'),gu=$('#gu'),gd=$('#gd');if(a){a.textContent=u;b.textContent=d;gu.style.width=(u?u/s*100:50)+'%';gd.style.width=(d?d/s*100:50)+'%'}}
async function startVote(){const key=SEL.team+'_'+SEL.album;await R('vote/'+key).set(null);VC={up:0,dn:0};await R('show').set({key,open:true,until:now()+10500});SHOWN[key]=1;VR&&VR.off();VR=R('vote/'+key);
  VR.on('value',s=>{const v=s.val()||{},u=v.up||0,d=v.dn||0;for(let k=0;k<Math.min(8,u-VC.up);k++)fl('👍');for(let k=0;k<Math.min(8,d-VC.dn);k++)fl('🤔');VC={up:u,dn:d};vUpd()});
  clearTimeout(VT);VT=setTimeout(()=>R('show/open').set(false),10500);const t0=now()+10500,iv=setInterval(()=>{const e=$('#vtm');const r=Math.ceil((t0-now())/1000);if(!e||r<0){clearInterval(iv);if(e)e.textContent='終了！';return}e.textContent=r},200)}
function fl(e){const s=document.createElement('span');s.className='fl';s.textContent=e;s.style.left=(5+Math.random()*90)+'%';document.body.appendChild(s);setTimeout(()=>s.remove(),2300)}
addEventListener('keydown',e=>{if(!HOST||!ST||ST.phase!=='show'||!SEL)return;const T=ST.turns;
  if(e.code==='Space'||e.code==='ArrowRight'){e.preventDefault();if(SS<=T){SS++;hStage();if(SS===T+1)startVote()}}
  else if(e.code==='ArrowLeft'){e.preventDefault();if(SS>0){if(SS===T+1){clearTimeout(VT);R('show/open').set(false)}SS--;hStage()}}});

// ================= 雪 =================
(()=>{const gl=$('#gl'),cs=['#e63946','#ffd166','#2ecc71','#4cc9f0'];
  for(let i=0;i<32;i++){const b=document.createElement('i');b.style.cssText=`--c:${cs[i%4]};left:${i/31*98+1}%;top:${6+Math.abs(Math.sin(i/31*Math.PI*7))*9}px;animation-delay:${(i%4)*.4}s`;gl.appendChild(b)}
  const c=$('#sn'),x=c.getContext('2d');let W,H,F=[];const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const init=()=>{W=c.width=innerWidth;H=c.height=innerHeight;F=Array.from({length:Math.min(90,W*H/12000|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.4,v:.4+Math.random()*1,p:Math.random()*7}))};
  const fr=()=>{x.clearRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.8)';for(const f of F){f.y+=f.v;f.p+=.02;f.x+=Math.sin(f.p)*.5;if(f.y>H){f.y=-5;f.x=Math.random()*W}x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fill()}requestAnimationFrame(fr)};
  init();addEventListener('resize',init);if(!RM)fr()})();
</script></body></html>
