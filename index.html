const RM=matchMedia('(prefers-reduced-motion: reduce)').matches,cf=$('#cf'),cx=cf.getContext('2d');let PA=[],cr=0;
function burst(n=160){if(RM)return;cf.width=innerWidth;cf.height=innerHeight;for(let i=0;i<n;i++){const L=i%2;PA.push({x:L?innerWidth:0,y:innerHeight*.85,vx:(L?-1:1)*(4+Math.random()*9),vy:-(9+Math.random()*13),w:6+Math.random()*7,c:['#e63946','#ffd166','#2ecc71','#fff','#4cc9f0'][i%5],r:Math.random()*6,vr:Math.random()*.4-.2})}if(!cr)cl()}
function cl(){cr=1;cx.clearRect(0,0,cf.width,cf.height);PA=PA.filter(p=>p.y<cf.height+30);for(const p of PA){p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.99;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);cx.restore()}PA.length?requestAnimationFrame(cl):(cr=0,cx.clearRect(0,0,cf.width,cf.height))}
addEventListener('keydown',e=>{if(!HOST||!ST||ST.phase!=='show'||!SEL)return;const T=ST.turns;
  if(e.code==='Space'||e.code==='ArrowRight'){e.preventDefault();if(SS<=T){SS++;ANIM=true;hStage();if(SS===T+1){burst(60);startVote()}}}
  else if(e.code==='ArrowLeft'){e.preventDefault();if(SS>0){if(SS===T+1){clearTimeout(VT);R('show/open').set(false)}SS--;ANIM=false;hStage()}}});

// ================= キーボード対策・雪 =================
addEventListener('focusin',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=='range'&&e.target.type!=='color')document.body.classList.add('kb')});
addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!a||!/INPUT|TEXTAREA/.test(a.tagName)){document.body.classList.remove('kb');scrollTo(0,0)}},80));
(()=>{const gl=$('#gl');for(let i=0;i<32;i++){const b=document.createElement('i');b.style.cssText=`--c:${BC[i%4]};left:${i/31*98+1}%;top:${6+Math.abs(Math.sin(i/31*Math.PI*7))*9}px;animation-delay:${(i%4)*.4}s`;gl.appendChild(b)}
  const c=$('#sn'),x=c.getContext('2d');let W=0,H,F=[];
  const init=()=>{W=c.width=innerWidth;H=c.height=innerHeight;F=Array.from({length:Math.min(90,W*H/12000|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.4,v:.4+Math.random(),p:Math.random()*7}))};
  const fr=()=>{x.clearRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.8)';for(const f of F){f.y+=f.v;f.p+=.02;f.x+=Math.sin(f.p)*.5;if(f.y>H){f.y=-5;f.x=Math.random()*W}x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fill()}requestAnimationFrame(fr)};
  init();addEventListener('resize',()=>{if(innerWidth!==W)init()});if(!RM)fr()})();
</script></body></html>
