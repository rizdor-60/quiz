<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RIZD'OR QUIZ</title>
<style>
:root{--bg:#04100c;--tr:#14513d;--g:#5dffb0;--a:#ffc857;--t:#d9fff0;--d:#6b9a89;--r:#ff6b6b;--p:rgba(8,32,25,.82)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--t);font:16px/1.5 "Hiragino Sans","Yu Gothic",sans-serif;min-height:100vh}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 120px}
.adm main{max-width:1080px}
.mono,.logo,.rk,.pt,.tm,.big,.ring span,table{font-family:ui-monospace,Menlo,monospace}
.logo{font-weight:700;font-size:13px;letter-spacing:.3em;color:var(--g);text-shadow:0 0 12px var(--g);animation:fl 5s infinite}
@keyframes fl{0%,92%,100%{opacity:1}94%{opacity:.35}96%{opacity:1}97%{opacity:.5}}
.card{background:var(--p);border:1px solid var(--tr);border-radius:14px;padding:18px;margin:14px 0;position:relative;backdrop-filter:blur(4px);animation:in .5s both}
.card::before{content:"";position:absolute;left:-1px;top:18px;width:3px;height:36px;background:var(--g);box-shadow:0 0 10px var(--g)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
h2{font-size:clamp(20px,4.4vw,32px);line-height:1.4}
.adm h2{font-size:clamp(26px,3.4vw,46px)}
input,textarea,button{font:inherit;color:var(--t)}
input,textarea{width:100%;background:#031510;border:1px solid var(--tr);border-radius:10px;padding:12px;margin:6px 0}
textarea{min-height:140px;font-family:ui-monospace,monospace;font-size:13px}
button{background:#0a2e23;border:1px solid var(--g);border-radius:10px;padding:12px 16px;cursor:pointer;transition:.2s}
button:hover:not(:disabled){box-shadow:0 0 14px rgba(93,255,176,.5)}
button:disabled{opacity:.35;cursor:default}
.ch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:10px 0;padding:16px;font-size:18px;animation:in .45s calc(var(--i)*.08s) both}
.ch b{font:700 14px ui-monospace,monospace;color:var(--g);border:1px solid var(--g);border-radius:6px;padding:1px 8px}
.ch:disabled{opacity:1}
.ch.sel{background:#0e4a37;box-shadow:0 0 18px var(--g)}
.ch.ok{background:#0e4a37;box-shadow:0 0 26px var(--g);animation:pulse 1s 2}
.ch.ng{opacity:.35}
.ch.ng.my{opacity:.8;border-color:var(--r)}
@keyframes pulse{50%{box-shadow:0 0 46px var(--g)}}
.ring{position:relative;width:96px;height:96px;margin-left:auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--tr)}
.ring .fg{stroke:var(--g);stroke-linecap:round;filter:drop-shadow(0 0 5px var(--g))}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:28px}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:6px 0;border:1px solid var(--tr);border-radius:10px;background:rgba(3,21,16,.7);animation:slide .5s calc(var(--i)*.09s) both;position:relative;overflow:hidden}
.row::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,rgba(93,255,176,.35),transparent);animation:sw 1.1s calc(var(--i)*.09s + .3s) 1}
@keyframes sw{to{left:110%}}
@keyframes slide{from{opacity:0;transform:translateX(-30px)}}
.row.me{border-color:var(--a);box-shadow:0 0 12px rgba(255,200,87,.4)}
.rk{font-weight:700;font-size:20px;color:var(--g);width:34px}
.rows>.row:nth-child(-n+3) .rk{color:var(--a)}
.nm{flex:1}.tm{color:var(--d);font-size:13px}.pt{font-weight:700;font-size:18px;color:var(--a)}
.tag{font-size:12px;border:1px solid var(--tr);border-radius:20px;padding:0 8px;color:var(--d)}
.bar{height:10px;border-radius:5px;background:var(--g);box-shadow:0 0 10px var(--g);transform-origin:left;animation:grow 1s calc(var(--i)*.12s) both}
@keyframes grow{from{transform:scaleX(0)}}
.big{font-weight:700;font-size:clamp(36px,10vw,72px);line-height:1.1;color:var(--g);text-shadow:0 0 22px var(--g)}
.small{color:var(--d);font-size:13px}
#ctl{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(3,16,12,.95);border-top:1px solid var(--g);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.adm #ctl{display:flex}
#set{position:fixed;inset:0;z-index:9;background:rgba(2,10,8,.97);overflow:auto;padding:20px;display:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.g2{grid-template-columns:1fr}}
table{border-collapse:collapse;font-size:13px}td{border:1px solid var(--tr);padding:2px 8px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head>
<body><canvas id="bg"></canvas>
<main><div class="logo">RIZD'OR // QUIZ<span id="demo"></span></div><div id="app"></div></main>
<div id="ctl"></div><div id="set"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ▼ Firebaseの設定をここに貼る
const CFG={apiKey:"AIzaSyCMAJ2NkKb9R1c9gNt2E5n1Xs6lCmpk3Kk",authDomain:"rizdor-quiz.firebaseapp.com",databaseURL:"https://rizdor-quiz-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"rizdor-quiz",appId:"1:711328313566:web:0d1ecbe62affd7f486d24f"};
// Firebase未設定・読み込み失敗のときは、このブラウザ内だけで動くデモモードになる
const DEMO=typeof firebase==='undefined'||!CFG.databaseURL;
let db,TS;
if(!DEMO){firebase.initializeApp(CFG);db=firebase.database();TS=firebase.database.ServerValue.TIMESTAMP}
else{const K='rq_demo',ld=()=>JSON.parse(localStorage[K]||'{}'),L=new Set(),ps=p=>p.split('/').filter(Boolean);TS={__ts:1};
  const fix=v=>Array.isArray(v)?v.map(fix):v&&typeof v==='object'?(v.__ts?Date.now():Object.fromEntries(Object.entries(v).map(([k,x])=>[k,fix(x)]))):v;
  const get=(o,p)=>ps(p).reduce((a,k)=>a==null?null:a[k],o)??null;
  const put=(o,p,v)=>{const ks=ps(p);let c=o;ks.slice(0,-1).forEach(k=>{if(typeof c[k]!=='object'||c[k]==null)c[k]={};c=c[k]});const l=ks[ks.length-1];if(v==null)delete c[l];else c[l]=v};
  const sv=o=>{localStorage[K]=JSON.stringify(o);L.forEach(h=>h())},snap=v=>({val:()=>v,numChildren:()=>v&&typeof v==='object'?Object.keys(v).length:0});
  addEventListener('storage',e=>{if(e.key===K)L.forEach(h=>h())});
  db={ref:p=>{p=p||'';const hs=[];return{
    on(e,f){const h=()=>f(snap(get(ld(),p)));hs.push(h);L.add(h);setTimeout(h,0)},
    off(){hs.forEach(h=>L.delete(h))},
    get:()=>Promise.resolve(snap(get(ld(),p))),
    set(v){const o=ld();put(o,p,fix(v));sv(o);return Promise.resolve()},
    update(u){const o=ld();for(const k in u)put(o,p?p+'/'+k:k,fix(u[k]));sv(o);return Promise.resolve()}}}}}
const SS=DEMO?sessionStorage:localStorage;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ADM=location.hash==='#admin';if(DEMO)document.addEventListener('DOMContentLoaded',()=>{$('#demo').textContent='  [DEMO: このブラウザ内のみ]'});if(ADM)document.body.classList.add('adm');
let S={q:-1,phase:'idle',openAt:0,bonus:true},Q=[],PUB={},PTS={},RES={},me=SS.rq_id||'',off=0,mine=null,cnt=0,cref=null;
db.ref('.info/serverTimeOffset').on('value',s=>off=s.val()||0);
const now=()=>Date.now()+off;
const on=(p,f)=>db.ref(p).on('value',s=>{f(s.val());draw()});
on('state',v=>{const o=S.q;S=Object.assign({q:-1,phase:'idle',openAt:0,bonus:true},v||{});
  if(S.q!==o){loadMine();if(ADM){cref&&cref.off();cnt=0;if(S.q>=0){cref=db.ref('resp/'+S.q);cref.on('value',s=>{cnt=s.numChildren();const e=$('#cnt');if(e)e.textContent=cnt})}}}});
on('q',v=>Q=v||[]);on('pub',v=>PUB=v||{});on('pts',v=>PTS=v||{});on('result',v=>RES=v||{});
function loadMine(){mine=null;if(me&&S.q>=0)db.ref(`resp/${S.q}/${me}`).get().then(s=>{mine=s.val();draw()})}

const login=()=>`<div class="card"><h2>ログイン</h2><p class="small">配られたIDとパスワードを入力してください</p><input id="li" placeholder="ID" inputmode="numeric" autocomplete="off"><input id="lp" placeholder="パスワード" autocomplete="off"><button onclick="doLogin()" style="width:100%;margin-top:8px">接続する</button><p id="le" class="small" style="color:var(--r)"></p></div>`;
async function doLogin(){const id=$('#li').value.trim(),p=$('#lp').value.trim(),s=await db.ref('pw/'+id).get();
  if(s.val()&&s.val()===p){me=id;SS.rq_id=id;loadMine();draw()}else $('#le').textContent='IDかパスワードが違います。配布された内容を確認してください'}

const row=(rk,id,sub,pt,i)=>{const u=PUB[id]||{};return `<div class="row${id===me?' me':''}" style="--i:${i}"><span class="rk">${rk}</span><span class="nm">${esc(u.name)} <span class="tag">${esc(u.team||'')}</span></span><span class="tm">${sub}</span><span class="pt">${pt!=null?pt+'pt':''}</span></div>`};
function board(){const t={};for(const id in PUB)t[id]={id,pt:0,tm:0};
  for(const q in PTS)for(const id in PTS[q])if(t[id])t[id].pt+=PTS[q][id];
  for(const q in RES){const ts=RES[q].times||{};for(const id in ts)if(t[id])t[id].tm+=ts[id]}
  return Object.values(t).sort((a,b)=>b.pt-a.pt||a.tm-b.tm)}
function teams(b){const m={};for(const id in PUB){const k=PUB[id].team||'-';m[k]=m[k]||{k,n:0,pt:0};m[k].n++}
  b.forEach(x=>{m[PUB[x.id].team||'-'].pt+=x.pt});return Object.values(m).map(x=>({...x,av:x.n?x.pt/x.n:0}))}
function rank(){const b=board(),tm=teams(b).sort((a,c)=>c.pt-a.pt),multi=tm.filter(x=>x.k!=='-').length>1,mx=Math.max(1,...tm.map(x=>x.pt)),mi=b.findIndex(x=>x.id===me);
  return `<div class="card"><div class="small">総合ランキング</div>${mi>=0?`<div class="mono" style="color:var(--a)">あなた ${mi+1}位 / ${b[mi].pt}pt</div>`:''}<div class="rows" style="margin-top:8px">${b.slice(0,ADM?15:10).map((x,i)=>row(i+1,x.id,(x.tm/1000).toFixed(1)+'秒',x.pt,i)).join('')}</div></div>`+
  (multi?`<div class="card"><div class="small">チーム対抗</div>${tm.map((x,i)=>`<div style="margin:14px 0"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(x.k)}</b><span class="mono">合計 ${x.pt}pt / 平均 ${x.av.toFixed(1)}pt (${x.n}人)</span></div><div class="bar" style="--i:${i};width:${x.pt/mx*100}%"></div></div>`).join('')}</div>`:'')}
function stat(r){const ts=r.times||{},ids=Object.keys(ts).sort((a,b)=>ts[a]-ts[b]),m=ts[me],pq=PTS[S.q]||{};
  const you=ADM?'':!mine?`<div class="small">この問題は未回答でした</div>`:m!=null?`<div class="big">正解</div><div class="mono">${(m/1000).toFixed(2)}秒 / この問題 ${ids.indexOf(me)+1}番手 / +${pq[me]||0}pt</div>`:`<div class="big" style="color:var(--r)">不正解</div>`;
  return `<div class="card">${you}<p class="small mono" style="margin-top:8px">正解 ${r.ok}/${r.n}人 / 正解者の平均 ${r.ok?(r.avg/1000).toFixed(2):'-'}秒</p></div><div class="card"><div class="small">最速チャレンジャー</div><div class="rows">${ids.slice(0,5).map((id,i)=>row(i+1,id,(ts[id]/1000).toFixed(2)+'秒',pq[id],i)).join('')}</div></div>`}
const ring=()=>`<div class="ring"><svg width="96" height="96"><circle class="bgc" cx="48" cy="48" r="43"/><circle class="fg" id="rf" cx="48" cy="48" r="43" stroke-dasharray="270"/></svg><span id="rt"></span></div>`;
function body(){const q=Q[S.q],P=S.phase,u=PUB[me],hd=u?`<div class="small mono" style="margin-top:6px">${esc(u.name)} / ${esc(u.team||'-')}</div>`:'';
  if(P==='rank')return hd+rank();
  if(!q||P==='idle')return hd+`<div class="card"><h2>まもなく開始</h2><p class="small">回線は接続済みです。画面はそのままでお待ちください。</p></div>`;
  const res=RES[S.q];
  const ch=q.c.map((c,i)=>{let k='ch';if(P==='reveal'&&res){k+=i===res.key?' ok':' ng';if(mine&&mine.c===i)k+=' my'}else if(mine&&mine.c===i)k+=' sel';
    return `<button class="${k}" style="--i:${i}" ${P!=='open'||mine||ADM?'disabled':''} onclick="ans(${i})"><b>${'ABCDEF'[i]}</b>${esc(c)}</button>`}).join('');
  return hd+`<div class="card"><div style="display:flex;align-items:center;gap:12px"><div class="small mono">Q${S.q+1}/${Q.length} ・ ${q.pts}pt</div>${P==='open'?ring():''}</div><h2 style="margin-top:8px">${esc(q.t)}</h2></div>${ch}`+
  (P==='open'?`<p class="small mono" style="text-align:center">${mine?'回答を受け付けました':'選択肢をタップして回答'}${ADM?` / 回答済み <span id="cnt">${cnt}</span>人`:''}</p>`:'')+
  (P==='closed'?`<p class="small mono" style="text-align:center">締め切りました。正解発表をお待ちください</p>`:'')+(P==='reveal'&&res?stat(res):'')}
function draw(){const a=$('#app');if(!a)return;
  if(!ADM&&!me){if(!$('#li'))a.innerHTML=login();return}
  a.innerHTML=body();ctl();tick()}
function tick(){cancelAnimationFrame(tick.r);const q=Q[S.q];if(S.phase!=='open'||!q)return;
  const L=q.l*1000,rem=S.openAt+L-now(),rf=$('#rf');
  if(rf){rf.style.strokeDashoffset=270*(1-Math.max(0,Math.min(1,rem/L)));$('#rt').textContent=Math.max(0,Math.ceil(rem/1000))}
  if(rem<=0){if(ADM)db.ref('state/phase').set('closed');else document.querySelectorAll('.ch').forEach(b=>b.disabled=true);return}
  tick.r=requestAnimationFrame(tick)}
function ans(i){const q=Q[S.q];if(mine||S.phase!=='open'||now()>S.openAt+q.l*1000+400)return;mine={c:i};draw();db.ref(`resp/${S.q}/${me}`).set({c:i,t:TS})}

// ---- 管理者 ----
const ph=p=>db.ref('state/phase').set(p);
const openQ=()=>db.ref('state').update({q:S.q+1,phase:'open',openAt:TS});
async function reveal(){const q=S.q,Qd=Q[q],key=(await db.ref('key/'+q).get()).val(),rs=(await db.ref('resp/'+q).get()).val()||{},L=Qd.l*1000,ls=[];
  for(const id in rs){const t=rs[id].t-S.openAt;if(rs[id].c===key&&t<=L+800)ls.push({id,t})}
  ls.sort((a,b)=>a.t-b.t);const pts={},times={};
  ls.forEach(x=>{times[x.id]=x.t;pts[x.id]=Qd.pts+(S.bonus?Math.round(Qd.pts*.5*Math.max(0,1-x.t/L)):0)});
  await db.ref().update({['pts/'+q]:ls.length?pts:null,['result/'+q]:{key,ok:ls.length,n:Object.keys(rs).length,avg:ls.length?ls.reduce((a,x)=>a+x.t,0)/ls.length:0,times:ls.length?times:null},'state/phase':'reveal'})}
function ctl(){if(!ADM)return;const P=S.phase;
  $('#ctl').innerHTML=`<button onclick="openQ()" ${S.q+1>=Q.length||P==='open'?'disabled':''}>出題 Q${S.q+2}</button><button onclick="ph('closed')" ${P!=='open'?'disabled':''}>締切</button><button onclick="reveal()" ${P!=='closed'?'disabled':''}>正解発表</button><button onclick="ph('rank')" ${S.q<0?'disabled':''}>ランキング</button><label class="small"><input type="checkbox" style="width:auto" ${S.bonus?'checked':''} onchange="db.ref('state/bonus').set(this.checked)"> 速さボーナス</label><button onclick="setup()">設定</button>`}
function setup(){const s=$('#set');s.style.display='block';
  s.innerHTML=`<button onclick="$('#set').style.display='none'">閉じる</button><div class="g2"><div class="card"><h2 style="font-size:20px">参加者を発行</h2><p class="small">1行に1人「名前,チーム」(チームは省略可)</p><textarea id="ul" placeholder="山田太郎,A&#10;佐藤花子,B"></textarea><button onclick="mkUsers()">ID・パスワードを発行</button><div id="ut" style="margin-top:10px"></div></div><div class="card"><h2 style="font-size:20px">問題を登録</h2><p class="small">問題ごとに空行で区切る。1行目が問題文(先頭に[配点,秒数]を付けられる。省略時は10点・15秒)。続く行が選択肢で、正解の行頭に * を付ける</p><textarea id="ql" placeholder="[10,15]日本の首都は？&#10;*東京&#10;大阪&#10;京都"></textarea><button onclick="mkQ()">問題を保存</button> <button onclick="rst()" style="border-color:var(--r)">進行をリセット</button> <button onclick="sample()">サンプル入力</button></div></div>`}
async function mkUsers(){const L=$('#ul').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!L.length||!confirm(L.length+'人を発行します。既存の参加者は上書きされます'))return;
  const pw={},pub={},rows=[];L.forEach((l,i)=>{const [n,t=''] =l.split(/[,，\t]/),id=String(i+1).padStart(3,'0'),p=String(1000+Math.random()*9000|0);pw[id]=p;pub[id]={name:n.trim(),team:t.trim()};rows.push([id,p,n.trim(),t.trim()])});
  await db.ref().update({pw,pub});window._rows=rows;
  $('#ut').innerHTML='<table>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('')+'</table><button onclick="csv()" style="margin-top:8px">CSVで保存</button>'}
function csv(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeffID,パスワード,名前,チーム\n'+_rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download='rizdor-quiz-accounts.csv';a.click()}
async function mkQ(){const q=[],key=[];
  $('#ql').value.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).forEach(b=>{const ls=b.split('\n').map(x=>x.trim()).filter(Boolean);let t=ls.shift(),pts=10,l=15;const m=t.match(/^\[(\d+)\s*[,，]\s*(\d+)\]/);if(m){pts=+m[1];l=+m[2];t=t.slice(m[0].length)}
    let k=0;const c=ls.map((x,i)=>{if(x[0]==='*'){k=i;x=x.slice(1)}return x});q.push({t,c,pts,l});key.push(k)});
  await db.ref().update({q,key});alert(q.length+'問を保存しました')}
function sample(){$('#ul').value='山田太郎,A\n佐藤花子,A\n鈴木一郎,B\n高橋美咲,B';$('#ql').value='[10,15]日本の首都は？\n*東京\n大阪\n京都\n\n[20,10]1+1は？\n1\n*2\n3\n4'}
async function rst(){if(!confirm('点数と回答をすべて消して、最初の状態に戻します'))return;
  await db.ref().update({state:{q:-1,phase:'idle',openAt:0,bonus:S.bonus},resp:null,pts:null,result:null});mine=null}
if(ADM)(async()=>{const r=db.ref('admin/pw'),s=await r.get(),p=prompt(s.val()?'管理者パスワード':'管理者パスワードを新しく決めてください');
  if(!s.val()&&p)await r.set(p);else if(s.val()!==p){document.body.innerHTML='<p style="padding:30px;color:#fff">認証に失敗しました。ページを再読み込みしてください</p>';throw 0}draw()})();

// ---- 背景: 回路基板 ----
(()=>{const c=$('#bg'),x=c.getContext('2d');let P=[],W,H;
  const init=()=>{W=c.width=innerWidth;H=c.height=innerHeight;P=[];const g=44,n=Math.max(16,W*H/35000|0);
    for(let i=0;i<n;i++){let px=Math.round(Math.random()*W/g)*g,py=Math.round(Math.random()*H/g)*g,h=Math.random()<.5;const pts=[[px,py]];
      for(let k=0;k<4+Math.random()*5;k++){const d=g*(1+(Math.random()*4|0))*(Math.random()<.5?-1:1);h?px+=d:py+=d;h=!h;pts.push([px,py])}
      let L=0;const cum=[0];for(let k=1;k<pts.length;k++)cum.push(L+=Math.abs(pts[k][0]-pts[k-1][0])+Math.abs(pts[k][1]-pts[k-1][1]));
      P.push({pts,cum,L,s:Math.random()*L,v:.5+Math.random()*1.2})}};
  const at=(p,d)=>{d=((d%p.L)+p.L)%p.L;let k=1;while(p.cum[k]<d)k++;const f=(d-p.cum[k-1])/(p.cum[k]-p.cum[k-1]),a=p.pts[k-1],b=p.pts[k];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]};
  const fr=()=>{x.clearRect(0,0,W,H);x.lineWidth=1.5;
    for(const p of P){x.strokeStyle='rgba(20,81,61,.6)';x.beginPath();p.pts.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.stroke();
      for(const q of [p.pts[0],p.pts[p.pts.length-1]]){x.beginPath();x.arc(q[0],q[1],4,0,7);x.stroke()}
      p.s+=p.v;for(let t=0;t<14;t++){const [a,b]=at(p,p.s-t*3);x.fillStyle=`rgba(93,255,176,${.9-t*.06})`;x.beginPath();x.arc(a,b,2.4-t*.1,0,7);x.fill()}}
    requestAnimationFrame(fr)};
  init();addEventListener('resize',init);fr()})();
</script></body></html>
